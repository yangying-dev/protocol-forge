name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Linux verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install tshark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark

      - name: Reject newly added or modified captures
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          # :(icase,glob) is required, not cosmetic: core.ignorecase is true on this repo, so
          # .gitignore's *.pcap already absorbs .PCAP — the gate has to agree or B.PCAP slips through.
          captures="$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- ':(icase,glob)**/*.pcap' ':(icase,glob)**/*.pcapng')"
          if [ -n "$captures" ]; then
            printf 'Real capture changes are forbidden in CI:\n%s\n' "$captures" >&2
            exit 1
          fi

      - name: Reject real capture filenames in tracked text
        run: python3 docs/check-no-capture-names.py

      - name: Restore
        run: |
          dotnet restore ProtocolForge.sln
          dotnet restore tests/pf-verify/PfVerify.csproj

      - name: Build
        run: |
          dotnet build ProtocolForge.sln -c Release --no-restore -warnaserror
          dotnet build tests/pf-verify/PfVerify.csproj -c Release --no-restore -warnaserror

      - name: Verification harness
        run: dotnet run --project tests/pf-verify/PfVerify.csproj -c Release --no-build

      # Separate process on purpose: the headless render initialises Avalonia and Skia,
      # which crashes a process that then goes on to run the tshark-backed groups.
      - name: Headless UI render
        run: dotnet run --project tests/pf-verify/PfVerify.csproj -c Release --no-build -- --ui

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y imagemagick dpkg-dev fakeroot libfuse2 desktop-file-utils

      - name: Download appimagetool
        run: |
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          sudo install "$RUNNER_TEMP/appimagetool" /usr/local/bin/appimagetool

      # The packaging scripts fall back to a hardcoded 0.1.0 when no version is given,
      # which no longer matches the csproj <Version>. Resolve it from the project and
      # fail loudly rather than silently naming the artifacts with a stale literal.
      - name: Resolve version from csproj
        run: |
          set -euo pipefail
          if ! version="$(dotnet build ProtocolForge/ProtocolForge.csproj -getProperty:Version -nologo | tr -d '\r' | tail -n1)"; then
            echo "::error::dotnet could not evaluate <Version> from ProtocolForge/ProtocolForge.csproj" >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9] ]]; then
            echo "::error::ProtocolForge.csproj resolved an unusable <Version>: '$version'" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Resolved version: $version"

      - name: Build Linux AppImage and deb
        env:
          # appimagetool is itself an AppImage. libfuse2 is installed above, but the
          # mount can still fail on a runner with no usable FUSE ("dlopen(): error
          # loading libfuse.so.2"). Extract-and-run skips the mount and produces the
          # same artifact, so the packaging step cannot fail on FUSE availability.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: APPIMAGETOOL=/usr/local/bin/appimagetool ./packaging/linux/publish-linux.sh

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: ProtocolForge-linux-x64-packages
          path: |
            artifacts/linux-x64/*.AppImage
            artifacts/linux-x64/*.deb
            artifacts/linux-x64/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  windows-release:
    name: Windows x64 publish probe
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Same reason as the Linux job: publish-windows.ps1 falls back to its own
      # hardcoded 0.1.0 unless PROTOCOLFORGE_VERSION is set.
      - name: Resolve version from csproj
        shell: pwsh
        run: |
          $version = (dotnet build ProtocolForge/ProtocolForge.csproj -getProperty:Version -nologo | Select-Object -Last 1)
          if ($LASTEXITCODE -ne 0 -or -not $version) {
            Write-Error "dotnet could not evaluate <Version> from ProtocolForge/ProtocolForge.csproj (exit $LASTEXITCODE)"
            exit 1
          }
          $version = $version.Trim()
          if ($version -notmatch '^\d+\.\d') {
            Write-Error "ProtocolForge.csproj resolved an unusable <Version>: '$version'"
            exit 1
          }
          "PROTOCOLFORGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Resolved version: $version"

      - name: Publish multi-file Windows x64
        shell: pwsh
        run: ./packaging/windows/publish-windows.ps1

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: ProtocolForge-windows-x64-package
          path: |
            artifacts/windows-x64/*.zip
            artifacts/windows-x64/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
